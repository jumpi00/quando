# Tiene attivo il progetto Supabase (il piano gratuito va in pausa dopo ~7 giorni
# senza utilizzo). Ogni 3 giorni fa una lettura leggera dal database.
# Se fallisce (es. progetto già in pausa), GitHub ti avvisa via email.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one event id
        env:
          # Chiave pubblica (la stessa di config.js), non un segreto.
          SUPABASE_URL: https://uwkwhuxhsqtyeqejqapv.supabase.co
          SUPABASE_KEY: sb_publishable_Iu5sGXn2BwxZWjse-sJ8Yw_ZoovbbQh
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase ha risposto: $status"
          test "$status" = "200"
